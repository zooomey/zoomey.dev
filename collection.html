<!DOCTYPE html>
<html lang="en">
<head>
    <title>Zoomey's Blog</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'Pixel Operator 8';
            src: url('https://time-travelling-birb.neocities.org/fonts/PixelOperator.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }

        body {
            font-family: 'Pixel Operator 8', monospace;
            background-image: url("img/arcade_carpet_pattern_by_glimmeringclaymore_denmtxa-pre.png");
            background-repeat: repeat;
            color: white;
            overflow-x: hidden;
        }

        marquee { 
            font-size: large;
            color: red;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: bold;
            background-color: black;
            padding: 10px 0;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            background-color: black;
            padding: 20px;
            overflow-y: auto;
            z-index: 100;
            border-right: 5px solid greenyellow;
        }

        .sidebar nav a {
            display: block;
            padding: 12px;
            margin: 10px 0;
            background-color: black;
            color: rgb(245, 244, 252);
            text-decoration: none;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            border: 3px solid blueviolet;
            transition: all 0.3s;
        }

        .sidebar nav a:hover {
            color: lightgreen;
            border-color: greenyellow;
            transform: scale(1.05);
        }

        .sidebar .social-links {
            margin-top: 30px;
            text-align: center;
        }

        .sidebar .social-links a {
            display: block;
            border: none;
            padding: 5px;
            margin: 5px 0;
        }

        .sidebar .social-links img {
            width: 70%;
            margin: 5px auto;
            display: block;
        }

        .sidebar .chat-box {
            margin-top: 20px;
            text-align: center;
        }

        .sidebar .chat-box img {
            width: 90%;
            margin: 10px auto;
        }

        .sidebar .chat-box iframe {
            width: 100%;
            height: 400px;
            border: 3px solid blueviolet;
            border-radius: 5%;
            margin: 10px 0;
        }

        .main-content {
            margin-left: 280px;
            width: calc(100% - 280px);
            padding: 20px;
        }

        .content-wrapper {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 20px;
            background-color: black;
            border: 5px solid blueviolet;
            border-radius: 10%;
            margin-bottom: 30px;
        }

        .header h1 {
            font-family: 'Pixel Operator 8', monospace;
            text-shadow: 2px 2px 13px #791283;
            color: white;
            font-size: 32px;
            margin: 20px 0;
        }

        .blog-post {
            background-color: black;
            border: 5px solid greenyellow;
            border-radius: 5%;
            padding: 30px;
            margin: 30px 0;
        }

        .blog-post h2 {
            color: white;
            text-shadow: 2px 2px 8px #791283;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .blog-post .post-meta {
            color: #aaa;
            font-size: 12px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid blueviolet;
        }

        .blog-post .post-content {
            font-size: 14px;
            line-height: 1.8;
            color: white;
        }

        .blog-post .post-content p {
            margin: 15px 0;
        }

        .blog-post .post-content img {
            max-width: 100%;
            height: auto;
            margin: 20px auto;
            display: block;
            border: 3px solid blueviolet;
        }

        .blog-post .post-tags {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px solid blueviolet;
        }

        .blog-post .post-tags span {
            display: inline-block;
            background-color: blueviolet;
            color: white;
            padding: 5px 10px;
            margin: 5px;
            border-radius: 5px;
            font-size: 11px;
        }

        .read-more {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: blueviolet;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .read-more:hover {
            background-color: greenyellow;
            color: black;
        }

        .blog-nav {
            text-align: center;
            margin: 30px 0;
        }

        .blog-nav a {
            display: inline-block;
            margin: 0 10px;
            padding: 10px 20px;
            background-color: black;
            color: rgb(245, 244, 252);
            text-decoration: none;
            border: 3px solid blueviolet;
            border-radius: 10px;
            transition: all 0.3s;
        }

        .blog-nav a:hover {
            color: lightgreen;
            border-color: greenyellow;
        }

        .foot {
            text-align: center;
            margin: 1px;
            padding: 1px;
        }

        .foot img {
            margin: 5px;
            padding: 1px;
            max-width: 300px;
            height: auto;
        }

        .penguin {
            position: fixed;
            top: 100px;
            left: 290px;
            width: 150px;
            z-index: 50;
            pointer-events: none;
        }

        a {
            color: rgb(245, 244, 252);
        }

        a:hover {
            color: lightgreen;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 180px;
            }
            .main-content {
                margin-left: 180px;
                width: calc(100% - 180px);
            }
            .penguin {
                display: none;
            }
        }
    </style>
</head>
<body>
    <marquee behavior="scroll" direction="left" scrollamount="20">I'M IN YOUR WALLS I'M IN YOUR WALLS I'M IN YOUR WALLS I'M IN YOUR WALLS I'M IN YOUR WALLS I'M IN YOUR WALLS I'M IN YOUR WALLS I'M IN YOUR WALLS I'M IN YOUR WALLS I'M IN YOUR WALLS</marquee>

    <div class="container">
        <aside class="sidebar">
            <img src="img/zoomeydevlogo.png" alt="Zoomey Dev Logo" style="width: 80%; display: block; margin: auto; padding-bottom: 10px;">
            <div class="social-links">
                <img src="blinkies/blinkiesCafe-Sd.gif" style="width: 100%;">
                <a href="https://twitter.com/zoomeyv2"><img src="blinkies/blinkiesCafe-sa.gif" alt="Twitter"></a>
                <a href="https://www.twitch.tv/zooomey"><img src="blinkies/blinkiesCafe-Dh.gif" alt="Twitch"></a>
                <a href="https://github.com/zooomey"><img src="blinkies/blinkiesCafe-c1.gif" alt="GitHub"></a>
            </div>

            <div class="chat-box">
                <img src="blinkies/blinkiesCafe-FM.gif" alt="Chat" style="width: 100%;">
                <iframe src="https://www3.cbox.ws/box/?boxid=3532537&boxtag=n7VeuI" allowtransparency="yes" allow="autoplay" frameborder="0" scrolling="auto"></iframe>
            </div>
        </aside>

        <main class="main-content">
            <div class="content-wrapper">
                <img class="penguin" src="img/penguindance.gif" alt="Dancing penguin">

                <section class="header">
                    <h1>digital collection of images and things I find cool</h1>
                    <p style="font-size: 14px;">yuuuuuup</p>
                </section>

                <img src="img/38.gif" style="margin-bottom: 20px; margin-left: 25%;">
   
                <article class="blog-post">
                    <h2>Blinkies</h2>
                        <img src="blinkies/chiikawa.gif">
                        <img src="blinkies/friendsonfire.gif">
                </article>

                <article class="blog-post">
                    <h2>Images</h2>
                        <img src="img/zoomeybeat.png">>
                        <img src="img/yuri.gif">
                        <img src="img/tacobell.gif">

                </article>

                <div class="foot">
                    <img src="blinkies/blinkiesCafe-PE.gif">
                    <img src="blinkies/blinkiesCafe-EB.gif">
                    <img src="blinkies/blinkiesCafe-Xa.gif">
                    <img src="blinkies/blinkiesCafe-aM.gif">
                    <img src="blinkies/blinkiesCafe-vA.gif">
                    <img src="blinkies/blinkiesCafe-lM.gif">
                    <img src="blinkies/blinkiesCafe-RD.gif">
                    <img src="blinkies/blinkiesCafe-eX.gif">
                </div>
            </div>
        </main>
    </div>
</body>
</html>
